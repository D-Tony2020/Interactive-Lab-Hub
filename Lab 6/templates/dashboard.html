<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SmartLight Controller Dashboard</title>

  <!-- ✅ 使用最新版 socket.io（兼容 Flask-SocketIO 5.x） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }
    button {
      padding: 6px 10px;
      margin: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #4285f4;
      color: white;
    }
    button:hover {
      background: #3367d6;
    }
    .on {
      background-color: #ffeb3b;
    }
    .off {
      background-color: #ddd;
    }
    .mode {
      font-weight: bold;
    }
    #logPanel {
      margin-top: 25px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>SmartLight Controller Dashboard</h1>

  <!-- ✅ 群控按钮 -->
  <button onclick="broadcast('always_on')">ALL ON</button>
  <button onclick="broadcast('always_off')">ALL OFF</button>
  <button onclick="broadcast('auto')">ALL AUTO</button>

  <!-- ✅ 状态表格 -->
  <table id="deviceTable">
    <thead>
      <tr>
        <th>Device ID</th>
        <th>Light</th>
        <th>Mode</th>
        <th>Sound Thresh</th>
        <th>Motion Thresh</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="deviceBody"></tbody>
  </table>

  <!-- ✅ 实时事件日志 -->
  <div id="logPanel"><b>Event Log:</b></div>

  <script>
    // 连接 SocketIO 服务器（自动适配当前主机）
    const socket = io("http://" + window.location.hostname + ":5000");
    const deviceBody = document.getElementById("deviceBody");
    const logPanel = document.getElementById("logPanel");
    let devices = {};

    // ===== SocketIO 连接状态 =====
    socket.on("connect", () => {
      console.log("✅ Connected to SocketIO server");
      appendLog("✅ Connected to SocketIO server");
    });

    socket.on("disconnect", () => {
      console.warn("⚠️ Disconnected from SocketIO server");
      appendLog("⚠️ Disconnected from SocketIO server");
    });

    // ===== 更新设备表格 =====
    function render() {
      deviceBody.innerHTML = "";
      for (const [id, d] of Object.entries(devices)) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${id}</td>
          <td class="${d.light_on ? 'on' : 'off'}">${d.light_on ? 'ON' : 'OFF'}</td>
          <td class="mode">${d.mode}</td>
          <td>${d.sound_thresh}</td>
          <td>${d.motion_thresh.toFixed(3)}</td>
          <td>
            <button onclick="setMode('${id}','auto')">Auto</button>
            <button onclick="setMode('${id}','always_on')">On</button>
            <button onclick="setMode('${id}','always_off')">Off</button>
          </td>`;
        deviceBody.appendChild(row);
      }
    }

    // ===== 接收设备状态更新 =====
    socket.on("update_status", data => {
      console.log("📩 Received update_status:", data);
      devices[data.device_id] = data.data;
      render();
      appendLog(`[STATUS] ${data.device_id}: mode=${data.data.mode}, light=${data.data.light_on}`);
    });

    // ===== 接收事件日志 =====
    socket.on("new_event", ev => {
      console.log("🎯 EVENT:", ev);
      appendLog(`[EVENT] ${ev.device_id}: ${JSON.stringify(ev.event)}`);
    });

    // ===== 发送控制命令 =====
    function setMode(id, mode) {
      fetch("/set_param", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({device_id: id, payload: {mode}})
      });
      appendLog(`[CMD] Sent to ${id}: mode=${mode}`);
    }

    function broadcast(mode) {
      fetch("/broadcast", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({mode})
      });
      appendLog(`[BROADCAST] All devices -> mode=${mode}`);
    }

    // ===== 实时日志显示 =====
    function appendLog(msg) {
      const line = document.createElement("div");
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logPanel.appendChild(line);
      logPanel.scrollTop = logPanel.scrollHeight;
    }
  </script>
</body>
</html>
