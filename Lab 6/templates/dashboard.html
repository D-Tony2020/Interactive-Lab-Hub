<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartLight Controller Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Socket.IO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --accent: #0078d7;
      --accent-hover: #005fa3;
      --text: #333;
      --subtext: #666;
      --border: #e0e0e0;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--accent);
    }

    #globalActions button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      margin-left: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #globalActions button:hover {
      background: var(--accent-hover);
    }

    #deviceGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 90%;
      max-width: 1100px;
      margin: 30px 0;
    }

    .deviceCard {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .deviceCard:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .deviceHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .deviceHeader h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .statusDot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #bbb;
    }

    .statusDot.on { background: #4caf50; }
    .statusDot.off { background: #d9534f; }

    .deviceBody {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--subtext);
    }

    .actions button {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 6px;
      padding: 6px 10px;
      margin: 5px 4px 0 0;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .actions button:hover {
      background: var(--accent-hover);
    }

    #logPanel {
      width: 90%;
      max-width: 1100px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 15px 20px;
      margin-bottom: 30px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--subtext);
      height: 200px;
      overflow-y: auto;
    }

    #logPanel b {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>SmartLight Controller Dashboard</h1>
    <div id="globalActions">
      <button onclick="broadcast('always_on')">ALL ON</button>
      <button onclick="broadcast('always_off')">ALL OFF</button>
      <button onclick="broadcast('auto')">ALL AUTO</button>
    </div>
  </header>

  <main id="deviceGrid"></main>

  <div id="logPanel">
    <b>Event Log:</b><br>
  </div>

  <script>
    const socket = io("http://" + window.location.hostname + ":5000", { transports: ["websocket"] });
    const deviceGrid = document.getElementById("deviceGrid");
    const logPanel = document.getElementById("logPanel");
    let devices = {};

    socket.on("connect", () => {
      appendLog("Connected to SocketIO server");
    });

    socket.on("disconnect", () => {
      appendLog("Disconnected from SocketIO server");
    });

    socket.on("update_status", data => {
      devices[data.device_id] = data.data;
      renderDevices();
    });

    socket.on("new_event", ev => {
      appendLog(`[${ev.device_id}] ${JSON.stringify(ev.event)}`);
    });

    function renderDevices() {
      deviceGrid.innerHTML = "";
      for (const [id, d] of Object.entries(devices)) {
        const card = document.createElement("div");
        card.className = "deviceCard";

        card.innerHTML = `
          <div class="deviceHeader">
            <h2>${id}</h2>
            <div class="statusDot ${d.light_on ? 'on' : 'off'}"></div>
          </div>
          <div class="deviceBody">
            <div><b>Mode:</b> ${d.mode}</div>
            <div><b>Sound Thresh:</b> ${d.sound_thresh}</div>
            <div><b>Motion Thresh:</b> ${d.motion_thresh.toFixed(3)}</div>
          </div>
          <div class="actions">
            <button onclick="setMode('${id}','auto')">Auto</button>
            <button onclick="setMode('${id}','always_on')">On</button>
            <button onclick="setMode('${id}','always_off')">Off</button>
          </div>
        `;
        deviceGrid.appendChild(card);
      }
    }

    function appendLog(msg) {
      const line = document.createElement("div");
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logPanel.appendChild(line);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function setMode(id, mode) {
      fetch("/set_param", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ device_id: id, payload: { mode } })
      });
      appendLog(`[CMD] ${id} -> ${mode}`);
    }

    function broadcast(mode) {
      fetch("/broadcast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode })
      });
      appendLog(`[BROADCAST] -> ${mode}`);
    }
  </script>
</body>
</html>
